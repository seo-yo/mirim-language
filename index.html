<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<title>미림어 사전</title>
<meta name="description" content="한국어인 듯, 미림어인 것. 친구의 이상한 말을 모으는 사전">
</head>
<body data-page="home">
<main class="wrap">
  <section class="hero">
    <p class="eyebrow">Mirim Dictionary / Private Language</p>
    <h1 class="hero__title">한국어인 듯.<br>미림어인 것.</h1>
    <p class="hero__sub">분명 아는 말인데, 처음 듣는 표현들.</p>
  </section>
  <form class="search" action="dictionary.html" method="get" role="search">
    <span class="search__label">한국어 ↔ 미림어</span>
    <input class="search__input" id="search-input" type="text" name="q" placeholder="한국어나 미림어 표현을 찾아보세요" autocomplete="off">
    <button class="btn btn--primary" type="submit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>검색</button>
  </form>
  <div class="recent" id="recent"></div>
  <section class="grid-2">
    <article class="card card--today" id="today"><p class="card__label">오늘의 발견</p></article>
    <article class="card card--recent" id="latest"><h2 class="card__title">다시 만나고 싶은 단어</h2></article>
  </section>
</main>
<script type="module" src="js/pages/home.js"></script>
</body>
</html>
